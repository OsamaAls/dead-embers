<title>Dead Embers</title>
<meta name="theme-color" content="#12100e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* ===================== Dead Embers HUD / UI =====================
   Ash and rust, ember accents, stencil display, thin rules, soot panels. Mobile first-class (safe areas). */
:root{
  --soot:#12100e;--soot2:#1a1714;--panel:rgba(20,17,14,.9);--panel2:rgba(30,26,21,.92);--glass:rgba(14,12,10,.62);
  --line:#3e352c;--line2:#5c4d3e;--bone:#ebe1ce;--dim:#a99c88;--mute:#857966;
  --ember:#e8742c;--ember2:#ffb067;--emberglow:rgba(232,116,44,.35);
  --blood:#cf3b2c;--sta:#d9cfb8;--food:#c9913a;--water:#6f9fb8;--sick:#93b24c;--good:#9cc46a;--story:#d7b56d;--warn:#e6a23c;
  --display:'Big Shoulders Stencil Display',Impact,'Arial Narrow',sans-serif;--body:'Barlow',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --gut:12px;color-scheme:dark
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--soot);color:var(--bone);font:15px/1.45 var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
#app{position:fixed;inset:0;overflow:hidden}
#view{position:absolute;inset:0}
#view canvas{display:block;touch-action:none}
.mono{font-family:var(--mono)}
.stencil{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em}
.kc{display:inline-grid;place-items:center;min-width:1.55em;height:1.55em;padding:0 .3em;border:1px solid var(--line2);border-bottom-width:2px;font:600 .72em/1 var(--mono);color:var(--bone);background:rgba(0,0,0,.35);vertical-align:.1em;margin-right:.45em}
.btn .kc{margin:0 0 0 .2em;color:inherit;border-color:currentColor;background:transparent;opacity:.75}
body.touch .k-hide{display:none}
/* one shared keyboard focus ring (shown only while the keyboard is in use) */
body.kbd .kf,body.kbd #dlg .ch button.sel,:focus-visible{outline:2px solid var(--ember2);outline-offset:2px;box-shadow:0 0 0 5px rgba(232,116,44,.22)}
body.kbd .kf{position:relative;z-index:1}
button:focus:not(:focus-visible){outline:none}
/* key legends in panel footers / dialogue / title */
.kh{font:500 11px/1.4 var(--mono);color:var(--dim);letter-spacing:.02em}
.kh b{font-weight:600;color:var(--bone);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-bottom-width:2px;padding:0 4px;margin-right:2px}
.kh i{font-style:normal;color:var(--mute);margin:0 6px}
body.touch .kh,body.touch .ft.kh-only{display:none}
[data-kn]{position:relative}
body.kbd [data-kn]::before{content:attr(data-kn);position:absolute;top:-7px;left:-7px;width:16px;height:16px;display:grid;place-items:center;font:600 10px/1 var(--mono);color:var(--soot);background:var(--ember2);z-index:2}

/* ---------- fx layers ---------- */
#vig{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,transparent 52%,var(--vc,rgba(170,20,10,.75)) 100%)}
#vig.pulse{animation:vigp 1.1s ease-in-out infinite}
@keyframes vigp{50%{filter:brightness(1.5)}}
#edge{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 0 3px rgba(222,52,34,.85),inset 0 0 90px 10px rgba(190,24,10,.55)}
body.lowhp #edge{opacity:1;animation:edgep 1.25s ease-in-out infinite}
@keyframes edgep{50%{opacity:.35}}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.go{animation:flash .32s ease-out}
@keyframes flash{0%{opacity:var(--fo,.45)}100%{opacity:0}}
#dmg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dn{position:absolute;left:0;top:0;font:600 15px/1 var(--mono);color:var(--bone);text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);white-space:nowrap;will-change:transform,opacity}
.dn.crit,.dn.big{font-size:20px;color:var(--ember2)}
.dn.hurt,.dn.bad{color:#ff6a55}.dn.heal,.dn.good{color:var(--good)}.dn.dim,.dn.info{color:var(--bone);font-size:13px}.dn.loot{color:var(--ember2);font-size:13px}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.hud-tl{position:absolute;top:calc(var(--sat) + var(--gut));left:calc(var(--sal) + var(--gut));width:184px;display:flex;flex-direction:column;gap:5px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.bar{display:grid;grid-template-columns:14px 1fr 28px;align-items:center;gap:7px;font:600 11px/1 var(--mono);color:var(--dim);letter-spacing:.04em}
.bar .ic{width:14px;height:14px;fill:var(--ic,var(--dim))}
.b-hp{--ic:#e0564a}.b-sta{--ic:var(--sta)}.b-food{--ic:var(--food)}.b-water{--ic:var(--water)}
.bar .tr{height:8px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.bar .fl{position:absolute;inset:0;transform-origin:left;background:var(--c);transition:transform .25s}
.bar .gh{position:absolute;inset:0;transform-origin:left;background:rgba(255,255,255,.35);transition:transform .6s .25s}
.bar .v{text-align:right;color:var(--bone);font-weight:400}
.bar.low .v{color:#ff7a62}.bar.low .fl{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.bar.reveal{animation:reveal .9s cubic-bezier(.2,.8,.2,1)}
@keyframes reveal{0%{opacity:0;transform:translateX(-14px)}40%{opacity:1}60%{filter:drop-shadow(0 0 6px var(--ember))}100%{transform:none}}
.b-hp{--c:linear-gradient(90deg,#9d2a1f,var(--blood))}.b-sta{--c:linear-gradient(90deg,#8d846f,var(--sta))}.b-food{--c:linear-gradient(90deg,#8c5f20,var(--food))}.b-water{--c:linear-gradient(90deg,#3c6276,var(--water))}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips:empty{display:none}
.chip{font:600 10.5px/1 var(--mono);letter-spacing:.06em;padding:3px 6px;border:1px solid currentColor;background:rgba(0,0,0,.55);text-transform:uppercase;white-space:nowrap}
.chip.bad{color:#ff6a55}.chip.sick{color:var(--sick)}.chip.warn{color:var(--warn)}.chip.good{color:var(--good)}.chip.ember{color:var(--ember2);pointer-events:auto;cursor:pointer;animation:chipglow 1.6s ease-in-out infinite}
@keyframes chipglow{50%{box-shadow:0 0 10px var(--emberglow)}}
.srow{display:flex;align-items:center;gap:8px;margin-top:2px}
/* companion chip: name, what it is doing, HP */
.cmp{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center;padding:5px 7px 6px;background:rgba(0,0,0,.5);border:1px solid var(--line);font:600 11px/1 var(--mono);letter-spacing:.05em;color:var(--bone);text-transform:uppercase}
.cmp .nm{display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp .nm svg{width:12px;height:12px;flex:none;fill:none;stroke:var(--ember2);stroke-width:2;stroke-linejoin:round}
.cmp .md{color:var(--dim);font-size:10px;letter-spacing:.08em}
.cmp .tr{grid-column:1/-1;height:5px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.1);position:relative;overflow:hidden}
.cmp .fl{position:absolute;inset:0;transform-origin:left;background:linear-gradient(90deg,#5d7a36,var(--good));transition:transform .25s}
.cmp.low .fl{background:linear-gradient(90deg,#9d2a1f,var(--blood))}
.cmp.down{border-color:var(--blood)}.cmp.down .md{color:#ff6a55;animation:blink 1s steps(2) infinite}
.clock{display:flex;align-items:center;gap:6px;font:600 12px/1 var(--mono);color:var(--bone);letter-spacing:.05em;text-shadow:0 1px 2px #000;white-space:nowrap}
.clock .sun{flex:none;width:9px;height:9px;border-radius:50%;background:var(--ember2);box-shadow:0 0 6px var(--ember)}
.clock.night .sun{background:transparent;box-shadow:inset -3px 0 0 0 #b9c6d6;transform:rotate(-20deg)}
.clock.night{color:#b9c6d6}
.clock .sep{color:var(--mute)}
.clock .ppl{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding-left:8px;border-left:1px solid var(--line2);color:var(--good)}
.clock .ppl svg{width:12px;height:12px;fill:currentColor}
.clock .ppl b{font-weight:600}
/* weather + season, next to the clock */
.srow{flex-wrap:wrap;row-gap:4px}
.wx{display:inline-flex;align-items:center;gap:4px;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-shadow:0 1px 2px #000;white-space:nowrap}
.wx svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wx.rain{color:var(--water)}.wx.fog{color:#c2bcb0}.wx.snow{color:#dfe8f2}.wx.cold{color:#9fd0ff}.wx.storm{color:#ff8a6a;animation:blink 1.4s steps(2) infinite}

.hud-tc{position:absolute;top:calc(var(--sat) + var(--gut));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:min(560px,calc(100vw - 440px))}
#obj{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 8px;background:rgba(14,12,10,.74);border:1px solid var(--line);font:500 14px/1.25 var(--body);white-space:nowrap;max-width:100%;backdrop-filter:blur(3px)}
#obj .tx{overflow:hidden;text-overflow:ellipsis}
#obj .ar{flex:none;width:18px;height:18px;display:grid;place-items:center;transition:opacity .3s}
#obj .ar svg{width:16px;height:16px;fill:var(--ember);transition:transform .12s linear}
#obj .ds{flex:none;font:600 11px var(--mono);color:var(--ember2)}
#obj.new{animation:objnew 1.2s ease-out}
@keyframes objnew{0%{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),0 0 22px var(--emberglow)}100%{box-shadow:none}}
#timer{display:flex;align-items:baseline;gap:10px;padding:4px 14px;background:rgba(60,14,8,.75);border:1px solid #7a2a1d}
#timer .lb{font:800 15px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--bone)}
#timer .t{font:600 22px/1 var(--mono);color:#ff8a66;min-width:2.6em;text-align:right}
#timer.urgent .t{animation:blink .5s steps(2) infinite}
#banner{text-align:center;padding:8px 20px 9px;background:linear-gradient(90deg,transparent,rgba(12,10,8,.85) 18%,rgba(12,10,8,.85) 82%,transparent);opacity:0;transform:translateY(-6px);transition:opacity .35s,transform .35s;max-width:min(560px,92vw)}
#banner.on{opacity:1;transform:none}
#banner .t{font:800 22px/1.05 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--ember2)}
#banner .l{font:500 14px/1.35 var(--body);color:var(--bone);margin-top:3px}

.hud-tr{position:absolute;top:calc(var(--sat) + var(--gut));right:calc(var(--sar) + var(--gut));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mm{display:block;width:132px;height:132px;border:1px solid var(--line2);background:rgba(10,9,8,.75);pointer-events:auto;cursor:pointer}
#mm.reveal{animation:reveal .9s}
.hbtns{display:flex;gap:4px;pointer-events:auto}
.hb{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 5px 0 8px;font:600 10.5px/1 var(--mono);letter-spacing:.08em;color:var(--dim);background:rgba(10,9,8,.78);border:1px solid var(--line);text-transform:uppercase}
.hb:hover{color:var(--bone);border-color:var(--line2)}
.hb svg{display:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hb .hk{font:600 10px/1 var(--mono);color:var(--bone);min-width:17px;height:17px;padding:0 3px;display:inline-grid;place-items:center;border:1px solid var(--line2);border-bottom-width:2px;background:rgba(0,0,0,.4);letter-spacing:0}
#hb-char.pts{border-color:var(--ember);color:var(--ember2)}
#hb-char.pts svg{filter:drop-shadow(0 0 4px var(--ember))}
#toasts{position:absolute;top:calc(var(--sat) + var(--gut) + 182px);right:calc(var(--sar) + var(--gut));display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;max-width:min(320px,58vw)}
#toasts.nomap{top:calc(var(--sat) + var(--gut) + 42px)}
.toast{--tc:var(--mute);display:flex;align-items:baseline;gap:8px;font:500 13px/1.3 var(--body);padding:5px 10px;background:rgba(12,10,8,.86);border:1px solid rgba(92,77,62,.55);animation:tin .25s ease-out;transition:opacity .4s,transform .4s}
.toast::before{content:'';flex:none;width:6px;height:6px;background:var(--tc);transform:translateY(-1px)}
.toast .xn{font:600 12px var(--mono);color:var(--ember2);margin-left:7px}
.toast.bump{animation:tbump .3s ease-out}
@keyframes tbump{40%{transform:translateX(-5px);background:rgba(58,38,24,.95)}}
.toast.out{opacity:0;transform:translateX(12px)}
.toast.good{--tc:var(--good)}.toast.loot{--tc:var(--ember);color:#f6dcc0}.toast.warn{--tc:var(--warn)}.toast.bad{--tc:var(--blood);color:#ffc3b8;border-color:rgba(207,59,44,.45)}.toast.story{--tc:var(--story);color:#f1e2bd;font-style:italic;background:rgba(30,24,14,.9)}.toast.dim{color:var(--dim)}
@keyframes tin{from{opacity:0;transform:translateX(16px)}}

.hud-br{position:absolute;right:calc(var(--sar) + var(--gut));bottom:calc(var(--sab) + var(--gut));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#wpn{display:flex;align-items:center;gap:10px;padding:7px 12px;background:rgba(14,12,10,.74);border:1px solid var(--line2);pointer-events:auto;cursor:pointer}
#wpn:hover{border-color:var(--ember)}
#wpn .n{font:800 17px/1 var(--display);letter-spacing:.07em;text-transform:uppercase}
#wpn .a{font:600 13px/1 var(--mono);color:var(--ember2)}
#wpn .a.out{color:#ff6a55}
#wpn .c{width:30px;height:4px;background:var(--line2)}
#wpn .c i{display:block;height:100%;background:var(--ember2)}
#wpn .c.low i{background:#ff6a55}
#wpn .k{font:600 10px var(--mono);color:var(--mute)}
#wpn.swap{animation:objnew .6s}
#barri{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 92px);width:min(320px,70vw);text-align:center}
#barri .lb{font:800 14px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bone);margin-bottom:5px;text-shadow:0 1px 2px #000}
#barri .pc{font:600 12px var(--mono);color:var(--ember2);margin-left:6px;letter-spacing:0}
#barri .tr{height:10px;background:rgba(0,0,0,.65);border:1px solid var(--line2);position:relative;overflow:hidden;transition:border-color .3s}
#barri .fl,#barri .gh{position:absolute;inset:0;transform-origin:left}
#barri .fl{background:linear-gradient(90deg,#7a4a1c,var(--ember));transition:transform .2s}
#barri .gh{background:#e0412c;transition:transform .5s .35s}
#barri.low .fl{background:linear-gradient(90deg,#7a1c14,var(--blood))}
#barri.hit .tr{animation:bhit .45s ease-out}
#barri.hit .lb{animation:bhitl .45s ease-out}
@keyframes bhit{0%{border-color:#ff6a55;box-shadow:0 0 12px rgba(255,80,50,.7)}100%{box-shadow:none}}
@keyframes bhitl{0%{color:#ff8a70}}

#prompt{position:absolute;left:50%;bottom:calc(var(--sab) + 120px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px 16px 8px 10px;background:var(--panel);border:1px solid var(--line2);font:600 14px/1.2 var(--body);white-space:nowrap;max-width:calc(100vw - 24px);pointer-events:none;transition:opacity .15s}
#prompt .key{flex:none;width:32px;height:32px;display:grid;place-items:center;position:relative;font:600 14px/1 var(--mono);letter-spacing:.04em;color:#1a0e06;background:var(--ember);border-bottom:2px solid #a24a14}
#prompt .ring{position:absolute;left:-4px;top:-4px;overflow:visible;pointer-events:none;display:none}
#prompt.hold .ring{display:block}
#prompt .ring rect{fill:none;stroke-width:2.5}
#prompt .ring .tk{stroke:rgba(255,176,103,.18)}
#prompt .ring .pg{stroke:var(--ember2);stroke-dasharray:100;stroke-dashoffset:100}
#prompt .tx{overflow:hidden;text-overflow:ellipsis}
#prompt .tx .hl{font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-right:7px}
#prompt.info{border-color:var(--line);color:var(--dim);font-weight:500;padding-left:14px}
#prompt.info .key{display:none}

#hint{position:absolute;left:50%;top:62%;transform:translate(-50%,8px);padding:9px 18px;background:rgba(12,10,8,.88);border:1px solid rgba(232,116,44,.35);font:500 15px/1.35 var(--body);color:var(--bone);text-align:center;max-width:min(520px,calc(100vw - 32px));opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
#hint.on{opacity:1;transform:translate(-50%,0)}
#wmark{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
#wmark .dia{width:14px;height:14px;border:2px solid var(--ember);background:rgba(232,116,44,.25);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 10px var(--emberglow)}
#wmark .dl{position:absolute;left:0;top:12px;transform:translateX(-50%);font:600 10px var(--mono);color:var(--ember2);text-shadow:0 1px 2px #000;white-space:nowrap}
#wmark .chev{display:none;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:16px solid var(--ember);transform:translate(-50%,-50%) rotate(var(--r,0rad));filter:drop-shadow(0 0 6px var(--emberglow))}
#wmark.edge .dia{display:none}#wmark.edge .chev{display:block}
#wmark.edge .dl{top:14px}
.ohp{position:absolute;left:0;top:0;width:54px;height:6px;margin-left:-27px;background:rgba(0,0,0,.65);border:1px solid #000;pointer-events:none}
.ohp i{display:block;height:100%;background:var(--good);transform-origin:left;transition:transform .15s}
.ohp.lo i{background:var(--blood)}
.ohp b{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font:600 11px var(--mono);color:var(--bone);white-space:nowrap;text-shadow:0 1px 2px #000}
.ohp.ehp{width:40px;height:5px;margin-left:-20px;margin-top:-4px;transition:opacity .2s}
.ohp.ehp i{background:linear-gradient(90deg,#b8321f,#ff6a4a)}
.ohp.ehp b{display:none}
#lock{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
#lock i{position:absolute;left:-11px;top:-30px;width:22px;height:14px;background:var(--ember2);clip-path:polygon(0 0,50% 55%,100% 0,100% 30%,50% 100%,0 30%);filter:drop-shadow(0 0 4px var(--ember));animation:lockb 1s ease-in-out infinite}
@keyframes lockb{50%{transform:translateY(-3px)}}

#lvl{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#lvl .in{text-align:center;animation:lvlin 2.6s cubic-bezier(.2,.8,.2,1) forwards}
#lvl .t{font:800 clamp(48px,11vw,96px)/.9 var(--display);letter-spacing:.08em;color:var(--ember2);text-shadow:0 0 30px var(--ember),0 0 2px #000}
#lvl .s{font:600 13px var(--mono);letter-spacing:.14em;color:var(--bone);margin-top:10px;text-transform:uppercase}
#lvl .rule{height:1px;width:0;margin:10px auto 0;background:var(--ember);animation:rule 1.2s .2s ease-out forwards}
@keyframes rule{to{width:min(360px,70vw)}}
@keyframes lvlin{0%{opacity:0;transform:scale(1.35)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}

/* ---------- touch controls ---------- */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
body.touch #touch{display:block}
body.blocked #touch,body.blocked #hud .hbtns{visibility:hidden}
#joy{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border:1px solid rgba(235,225,206,.18);border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.05),rgba(0,0,0,.3));opacity:.55;transition:opacity .2s}
#joy.on{opacity:1}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(235,225,206,.18);border:1px solid rgba(235,225,206,.4)}
#joy.sprint i{background:rgba(232,116,44,.4);border-color:var(--ember)}
.tb{position:absolute;pointer-events:auto;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(235,225,206,.28);background:rgba(14,12,10,.55);color:var(--bone);font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;touch-action:none}
.tb.on,.tb:active{background:rgba(232,116,44,.38);border-color:var(--ember)}
#t-atk{width:84px;height:84px;right:calc(var(--sar) + 18px);bottom:calc(var(--sab) + 26px);border-color:rgba(232,116,44,.6);font-size:12px}
#t-dodge{width:58px;height:58px;right:calc(var(--sar) + 112px);bottom:calc(var(--sab) + 20px)}
#t-use{width:62px;height:62px;right:calc(var(--sar) + 104px);bottom:calc(var(--sab) + 94px)}
#t-use.ready{border-color:var(--ember);box-shadow:0 0 14px var(--emberglow)}
#t-crouch{width:50px;height:50px;right:calc(var(--sar) + 30px);bottom:calc(var(--sab) + 124px)}
#t-pack{width:46px;height:46px;right:calc(var(--sar) + 172px);bottom:calc(var(--sab) + 104px);font-size:9px}
#t-tgt{width:50px;height:50px;right:calc(var(--sar) + 176px);bottom:calc(var(--sab) + 30px);font-size:8.5px;align-content:center;gap:1px}
#t-tgt svg{width:18px;height:18px;fill:none;stroke:var(--ember2);stroke-width:2;stroke-linecap:round}
#t-throw{width:48px;height:48px;right:calc(var(--sar) + 171px);bottom:calc(var(--sab) + 103px);font-size:9px;border-color:rgba(255,176,103,.5)}
#touch.throw #t-pack{display:none}
#t-comp{width:50px;height:50px;left:calc(var(--sal) + 18px);bottom:calc(var(--sab) + 196px);font-size:9px;border-color:rgba(255,176,103,.45)}
body.touch .hud-br{bottom:calc(var(--sab) + 190px)}
body.touch #prompt{bottom:calc(var(--sab) + 176px)}
body.touch #barri{bottom:calc(var(--sab) + 226px)}

/* ---------- shared surfaces ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;background:#241e18;border:1px solid var(--line2);color:var(--bone);font:600 13px/1.1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.btn:hover:not(:disabled){border-color:var(--ember);color:#fff}
.btn.pri{background:var(--ember);border-color:var(--ember);color:#1a0e06}
.btn.pri:hover:not(:disabled){background:var(--ember2);color:#1a0e06}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.38;cursor:default}
.muted{color:var(--dim)}

/* dialogue sheet */
#dlg{position:absolute;left:50%;bottom:calc(var(--sab) + 18px);transform:translateX(-50%);width:min(700px,calc(100vw - 20px));background:var(--panel);border:1px solid var(--line2);padding:14px 18px 14px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{opacity:0;transform:translate(-50%,24px)}}
#dlg .who{font:800 20px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ember2);margin-bottom:8px;display:flex;align-items:center;gap:10px}
#dlg .who:after{content:'';flex:1;height:1px;background:var(--line)}
#dlg .who:empty{display:none}
#dlg .ln{font:500 17px/1.5 var(--body);color:var(--bone);min-height:3em}
#dlg .ln p{margin:0 0 4px}
#dlg .ln .sp{font:600 12px var(--mono);color:var(--ember2);letter-spacing:.08em;text-transform:uppercase;margin-right:8px}
#dlg .nx{display:flex;justify-content:flex-end;margin-top:4px}
#dlg .nx button{background:none;border:0;padding:6px 0 0 20px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;animation:nxp 1.4s ease-in-out infinite}
@keyframes nxp{50%{color:var(--ember2)}}
#dlg .ch{display:flex;flex-direction:column;gap:5px;margin-top:10px;max-height:min(52vh,420px);overflow:auto;padding:3px;margin-left:-3px;margin-right:-3px}
#dlg .ch.many button{min-height:38px;padding:6px 12px}
#dlg .kh{margin-top:8px;text-align:right}
#dlg .ch button.sel .num{background:var(--ember)}
#dlg .ch button{display:flex;align-items:center;gap:10px;text-align:left;min-height:42px;padding:8px 12px;background:rgba(36,30,24,.85);border:1px solid var(--line);font:500 15px/1.3 var(--body);animation:chin .25s both}
#dlg .ch button:nth-child(2){animation-delay:.04s}#dlg .ch button:nth-child(3){animation-delay:.08s}#dlg .ch button:nth-child(4){animation-delay:.12s}
@keyframes chin{from{opacity:0;transform:translateY(6px)}}
#dlg .ch button:hover:not(:disabled),#dlg .ch button.sel{border-color:var(--ember);background:rgba(58,38,24,.9)}
#dlg .ch button .num{flex:none;font:600 11px var(--mono);color:var(--soot);background:var(--dim);width:20px;height:20px;display:grid;place-items:center}
#dlg .ch button:hover:not(:disabled) .num{background:var(--ember)}
#dlg .ch button .lb{flex:1}
#dlg .ch button .note{flex:none;font:600 11px var(--mono);color:var(--ember2);letter-spacing:.04em}
#dlg .ch button:disabled{opacity:.42;cursor:default}
#dlg .ch button:disabled .note{color:var(--dim)}
#dlg .res{font:500 16px/1.5 var(--body)}
#dlg .tag{display:inline-block;font:600 10px var(--mono);letter-spacing:.12em;padding:2px 6px;margin-bottom:6px;border:1px solid}
#dlg .tag.ok{color:var(--good)}#dlg .tag.no{color:#ff6a55}

/* panels */
#pnl-wrap{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,5,4,.55);backdrop-filter:blur(2px);padding:calc(var(--sat) + 14px) calc(var(--sar) + 14px) calc(var(--sab) + 14px) calc(var(--sal) + 14px)}
#pnl{width:min(780px,100%);max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pin .22s ease-out}
#pnl.narrow{width:min(460px,100%)}
@keyframes pin{from{opacity:0;transform:scale(.98) translateY(8px)}}
.ph{display:flex;align-items:center;gap:12px;padding:12px 12px 10px 18px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font:800 26px/1 var(--display);letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ph h2::before,#dlg .who::before,#mg h2::before{content:'';flex:none;width:7px;height:7px;background:var(--ember);box-shadow:0 0 8px var(--emberglow)}
#mg h2::before{display:inline-block;vertical-align:.3em;margin-right:10px}
.ph .sub{font:600 12px var(--mono);color:var(--dim);letter-spacing:.06em;padding-top:4px}
.ph .x{margin-left:auto;width:40px;height:40px;background:none;border:1px solid var(--line);font:400 20px/1 var(--mono);color:var(--dim)}
.ph .x:hover{color:var(--bone);border-color:var(--line2)}
.tabs{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px 8px;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.tabs button.on{color:var(--bone);border-color:var(--ember)}
.tabs button:hover{color:var(--bone)}
.pb-body{padding:14px 18px 18px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;min-height:0}
.pb-body h3{margin:16px 0 8px;font:800 15px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:10px}
.pb-body h3:first-child{margin-top:2px}
.pb-body h3:after{content:'';flex:1;height:1px;background:var(--line)}
.pb-body p{margin:0 0 8px}
.ft{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ft .kh{margin-right:auto}
.ft.kh-only{padding:8px 18px;background:rgba(0,0,0,.18)}
.empty{color:var(--dim);font-style:italic;padding:6px 0}
.emptyst{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 12px 22px;color:var(--dim);border:1px dashed var(--line);background:rgba(0,0,0,.14)}
.emptyst svg{width:30px;height:30px;fill:none;stroke:var(--line2);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:2px}
.emptyst b{font:800 16px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--bone)}
.emptyst span{font-size:14px;max-width:36ch}
.hintline{font-size:13px;color:var(--dim);margin:0 0 10px}
.logl{font:500 12px/1.45 var(--mono);color:var(--dim);margin:0 0 4px}
.pts{font:600 12px var(--mono);color:var(--ember2);letter-spacing:.06em}
.why{font:600 11.5px var(--mono);color:var(--dim)}
.why.ok{color:var(--good)}
.lv{font:600 11.5px var(--mono);color:var(--dim)}
.fx{font-size:12.5px;color:var(--dim)}
.cols h3 .dir{color:var(--mute);font-family:var(--mono);font-size:12px}
.wbar{display:flex;align-items:center;gap:10px;font:600 11px var(--mono);color:var(--dim);margin-bottom:12px}
.wbar .tr{flex:1;height:6px;background:rgba(0,0,0,.5);border:1px solid var(--line)}
.wbar .fl{height:100%;background:var(--dim)}
.wbar.over .fl{background:var(--blood)}.wbar.over{color:#ff7a62}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.it{position:relative;text-align:left;padding:8px 9px 9px;min-height:62px;background:rgba(36,30,24,.7);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.it .n::before{content:'';display:inline-block;width:6px;height:6px;margin-right:7px;vertical-align:.12em;background:var(--cc,var(--mute))}
.it:hover,.it.sel{border-color:var(--ember);background:rgba(52,38,26,.85)}
.det .acts{display:flex;flex-wrap:wrap;gap:8px}
.it .n{font:500 13px/1.2 var(--body)}
.it .q{font:600 12px var(--mono);color:var(--ember2)}
.it .eq{position:absolute;top:5px;right:6px;font:600 9px var(--mono);color:var(--good);letter-spacing:.08em}
.c-food{--cc:var(--food)}.c-water{--cc:var(--water)}.c-med{--cc:#d0675a}.c-weapon{--cc:var(--ember)}.c-ammo{--cc:#b8862f}.c-gear{--cc:var(--good)}.c-mat{--cc:#8a7d6a}.c-misc{--cc:#6c6a7a}.c-story{--cc:var(--story)}
.det{margin-top:12px;padding:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.det .dn2{flex:1 1 180px}
.det .dn2 b{font:800 18px/1 var(--display);letter-spacing:.07em;text-transform:uppercase}
.det .dn2 div{font-size:13px;color:var(--dim);margin-top:3px}
.attr{display:grid;grid-template-columns:44px 1fr auto 40px;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(62,53,44,.6)}
.attr .k{font:800 18px/1 var(--display);letter-spacing:.08em;color:var(--ember2)}
.attr .d b{display:block;font-weight:600}
.attr .d span{font-size:13px;color:var(--dim)}
.attr .v{font:600 20px var(--mono)}
.attr button{width:36px;height:36px;background:var(--ember);border:0;color:#1a0e06;font:600 20px/1 var(--mono)}
.attr button:hover{background:var(--ember2)}
.attr.kf,.row.kf{background:rgba(58,38,24,.45)}
.row.kf,.attr.kf{outline-offset:0}
.xp{display:flex;align-items:center;gap:10px;font:600 11px var(--mono);color:var(--dim);margin:6px 0 4px}
.xp .tr{flex:1;height:6px;background:rgba(0,0,0,.5);border:1px solid var(--line)}
.xp .fl{height:100%;background:var(--ember)}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font:600 12px var(--mono);color:var(--dim)}
.kv b{color:var(--bone);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(62,53,44,.6);flex-wrap:wrap}
.row .grow{flex:1 1 160px;min-width:0}
.row .t1{font-weight:600}
.row .t2{font-size:13px;color:var(--dim)}
.row .cost{font:500 11.5px var(--mono);color:var(--dim)}
.row .cost .miss{color:#ff7a62}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{display:flex;flex-direction:column;gap:3px}
.mini button{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:7px 9px;min-height:36px;background:rgba(36,30,24,.7);border:1px solid var(--line);font:500 13px/1.2 var(--body)}
.mini button:hover:not(:disabled),.mini button.kf{border-color:var(--ember)}
.mini button .q{font:600 12px var(--mono);color:var(--ember2)}
.mini button:disabled{opacity:.4}
select{background:#241e18;color:var(--bone);border:1px solid var(--line2);padding:6px 8px;font:500 13px var(--body);min-height:36px}
.jt{padding:0 0 12px;margin:0 0 12px;border-bottom:1px solid rgba(62,53,44,.6)}
.jt:last-child{border-bottom:0}
.jt .h{font:800 16px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.jt .h::before{content:'';display:inline-block;width:6px;height:6px;margin-right:8px;vertical-align:.2em;background:var(--ember)}
.jt .d{font:600 10px var(--mono);color:var(--mute);margin-left:8px}
.jt p{color:#d7ccb8;font-size:14px;margin:6px 0 0;user-select:text;-webkit-user-select:text}
.objbig{font:600 19px/1.35 var(--body);padding:10px 14px;margin:2px 0 12px;background:rgba(232,116,44,.07);border:1px solid rgba(232,116,44,.3)}
.arc{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(62,53,44,.6)}
.arc .pips{display:flex;gap:3px}
.arc .pips i{flex:1;height:6px;background:rgba(255,255,255,.08)}
.arc .pips i.on{background:var(--ember)}
#mapc{display:block;width:auto;max-width:100%;height:auto;max-height:calc(min(86vh,760px) - 160px);margin:0 auto;background:#0c0b0a;border:1px solid var(--line);image-rendering:pixelated}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:600 11px var(--mono);color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}
.help{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:14px}
.help div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid rgba(62,53,44,.5)}
.help span:last-child{font:600 12px var(--mono);color:var(--ember2);text-align:right}
.menu{display:flex;flex-direction:column;gap:6px}
.menu .btn{justify-content:flex-start;min-height:46px;font-size:13px}
.menu .vol{display:grid;grid-template-columns:auto 1fr 34px;align-items:center;gap:12px;min-height:46px;padding:0 16px;border:1px solid var(--line2);background:#241e18;font:600 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.menu .vol input{width:100%;accent-color:var(--ember);cursor:pointer}
.menu .vol b{text-align:right;font-weight:600;color:var(--dim)}
.sum{display:flex;flex-direction:column;gap:6px}
.sum div{--tc:var(--mute);display:flex;align-items:baseline;gap:10px;padding:7px 10px;border:1px solid rgba(62,53,44,.7);background:rgba(0,0,0,.2);font-size:14.5px}
.sum div::before{content:'';flex:none;width:6px;height:6px;background:var(--tc);transform:translateY(-1px)}
.sum .good{--tc:var(--good)}.sum .bad{--tc:var(--blood);background:rgba(80,20,12,.25)}.sum .warn{--tc:var(--warn)}
.sum .radio{--tc:var(--story);font-family:var(--mono);font-size:13px;color:#e9dcb9}

/* barter */
.bt{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt h4,.offer h4{margin:0 0 6px;font:600 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.offer{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px;border:1px solid var(--line2);background:rgba(0,0,0,.28);margin-bottom:10px}
.offer .side{min-height:58px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px}
.offer .tok{font:500 13px/1 var(--body);padding:6px 7px;background:#2b231b;border:1px solid var(--line2)}
.offer .tok:hover{border-color:var(--ember)}
.bst{font:600 12px var(--mono);color:var(--dim);align-self:center}
.bst.short{color:#ff8a70}
.offer .tok b{font:600 11px var(--mono);color:var(--ember2);margin-left:4px}
.bal{grid-column:1/-1;display:flex;align-items:center;gap:10px;font:600 12px var(--mono)}
.bal .tr{flex:1;height:10px;background:rgba(0,0,0,.6);border:1px solid var(--line);position:relative}
.bal .tr .y{position:absolute;left:0;top:0;bottom:0;background:var(--good)}
.bal .tr .th{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bone)}
.bal .tr.short .y{background:#9d4a2a}
.mini .pr{font:600 11px var(--mono);color:var(--dim)}

/* minigames */
#mg{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,5,4,.6);backdrop-filter:blur(2px)}
#mg .box{width:min(360px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line2);padding:16px 18px 18px;text-align:center;animation:pin .2s}
#mg h2{margin:0 0 2px;font:800 26px/1 var(--display);letter-spacing:.1em;text-transform:uppercase}
#mg .s{font:600 11px var(--mono);color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
#mg canvas{display:block;margin:12px auto 8px;width:240px;height:240px;max-width:70vw;max-height:70vw;touch-action:none}
#mg .st{display:flex;justify-content:center;gap:18px;font:600 12px var(--mono);color:var(--dim)}
#mg .st b{color:var(--bone)}
#mg .tip{margin-top:10px;font:500 14px var(--body);color:var(--bone)}
#mg .res{font:800 34px/1 var(--display);letter-spacing:.12em;margin-top:6px}
#mg .res.ok{color:var(--good)}#mg .res.no{color:#ff6a55}
#mg .tap{margin-top:12px;width:100%;min-height:58px}

/* title */
#title{position:absolute;inset:0;touch-action:pan-y;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--sat) + 20px) calc(var(--sar) + 18px) calc(var(--sab) + 20px) calc(var(--sal) + 18px);background:radial-gradient(ellipse at 50% 38%,rgba(70,30,12,.35),rgba(10,8,7,.9) 70%),linear-gradient(180deg,rgba(10,8,7,.55),rgba(10,8,7,.92));overflow:auto}
#title .logo{font:800 clamp(64px,16vw,150px)/.82 var(--display);letter-spacing:.04em;text-align:center;color:var(--bone);text-shadow:0 0 40px rgba(232,116,44,.25)}
#title .logo span{display:block;color:var(--ember);text-shadow:0 0 36px rgba(232,116,44,.55)}
#title .tag{font:600 12px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin:18px 0 30px;text-align:center}
#title .acts{display:flex;flex-direction:column;gap:8px;width:min(300px,100%)}
#title .acts .btn{min-height:50px;font-size:14px}
#title .ver{position:absolute;bottom:calc(var(--sab) + 10px);right:calc(var(--sar) + 14px);font:600 11px var(--mono);color:var(--mute);letter-spacing:.1em}
#title .tkh{margin-top:16px;text-align:center}
.embers{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.embers i{position:absolute;bottom:-10px;width:3px;height:3px;background:var(--ember2);box-shadow:0 0 6px var(--ember);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}10%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,30px),-105vh)}}
.newg{width:min(760px,100%);display:flex;flex-direction:column;gap:14px;position:relative}
.newg h2{margin:0;font:800 30px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;text-align:center}
.newg label{font:600 11px var(--mono);letter-spacing:.12em;color:var(--dim);text-transform:uppercase;display:flex;flex-direction:column;gap:6px}
.newg input{background:rgba(0,0,0,.45);border:1px solid var(--line2);color:var(--bone);padding:10px 12px;font:600 17px var(--body);-webkit-user-select:text;user-select:text;outline:none}
.newg input:focus{border-color:var(--ember)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bgc{text-align:left;padding:10px 12px;background:rgba(24,20,16,.85);border:1px solid var(--line);min-height:86px;display:flex;flex-direction:column;gap:4px}
.bgc b{font:800 19px/1 var(--display);letter-spacing:.08em;text-transform:uppercase}
.bgc span{font-size:13px;color:var(--dim);line-height:1.3}
.bgc em{font:600 10.5px var(--mono);font-style:normal;color:var(--ember2);letter-spacing:.06em;margin-top:auto}
.bgc.on{border-color:var(--ember);background:rgba(60,34,18,.9);box-shadow:inset 0 0 0 1px var(--ember)}
.bgc:hover{border-color:var(--line2)}
body.kbd .bgc.kf{box-shadow:inset 0 0 0 1px var(--ember),0 0 0 5px rgba(232,116,44,.22)}
.newg .go{display:flex;gap:8px;justify-content:center}
.newg .go .btn{min-width:150px;min-height:48px}
.newg .names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#title .acts .btn small{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:none;opacity:.75}
#title .acts .btn.cont{flex-direction:column;gap:4px}
/* saved worlds */
.worlds{width:min(680px,100%);display:flex;flex-direction:column;gap:14px;position:relative;max-height:100%}
.worlds h2{margin:0;font:800 30px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;text-align:center}
.wl{display:flex;flex-direction:column;gap:6px;overflow:auto;padding:6px;margin:-6px}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(24,20,16,.85);border:1px solid var(--line);transition:background .15s,border-color .15s}
.wrow:hover,.wrow:has(.kf){background:rgba(46,32,20,.92);border-color:var(--ember)}
.wrow:not(.mem) .wi b::before{content:'';width:7px;height:7px;flex:none;background:var(--ember);box-shadow:0 0 6px var(--emberglow)}
.wrow .wi{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wrow .wi b{font:800 20px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;display:flex;align-items:center;gap:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .wi span{font:500 13px/1.3 var(--body);color:var(--dim)}
.wrow .wi em{font:600 10.5px var(--mono);font-style:normal;color:var(--ember2);letter-spacing:.06em;text-transform:uppercase}
.wrow .wa{display:flex;align-items:center;gap:6px;flex:none}
.wrow.mem{background:rgba(16,14,12,.8);opacity:.86}
.wrow.mem:hover,.wrow.mem:has(.kf){background:rgba(28,24,20,.9);border-color:var(--line2);opacity:1}
.wrow.mem .wi b{color:var(--dim)}.wrow.mem .wi em{color:#c9a27a}
.wrow .cross{width:10px;height:14px;flex:none;position:relative;display:inline-block}
.wrow .cross::before,.wrow .cross::after{content:'';position:absolute;background:var(--mute)}
.wrow .cross::before{left:4px;top:0;width:2px;height:14px}.wrow .cross::after{left:0;top:4px;width:10px;height:2px}
.wrow .mtag{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:4px 7px}
.wrow.conf,.wrow.conf:has(.kf){border-color:var(--blood);background:rgba(50,18,12,.9)}
.wrow .q{font:600 11px var(--mono);letter-spacing:.06em;color:#ff7a62;text-transform:uppercase}
.btn.danger{background:#7a2318;border-color:var(--blood);color:#fff}
.btn.danger:hover:not(:disabled){background:var(--blood)}
.worlds .go{display:flex;gap:8px;justify-content:center}
.worlds .go .btn{min-width:150px;min-height:48px}
.ctag{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ember2);border:1px solid rgba(255,176,103,.45);padding:1px 5px;margin-left:6px;vertical-align:2px}
.row .want{color:var(--story)}

/* end card */
#end{position:absolute;inset:0;touch-action:pan-y;display:flex;align-items:center;justify-content:center;padding:calc(var(--sat) + 20px) 18px calc(var(--sab) + 20px);background:rgba(8,7,6,.9);overflow:auto;animation:fadein 1.2s}
@keyframes fadein{from{opacity:0}}
#end .card{width:min(560px,100%);text-align:center}
#end .ey{font:600 11px var(--mono);letter-spacing:.24em;color:var(--dim);text-transform:uppercase}
#end h1{margin:10px 0 18px;font:800 clamp(44px,10vw,76px)/.92 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ember2)}
#end.dead h1{color:#e05a46}
#end .bt2 p{font:500 17px/1.55 var(--body);margin:0 0 10px;color:#e3d8c4;opacity:0;animation:lnin .8s forwards}
@keyframes lnin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#end .stats{display:flex;justify-content:center;gap:26px;margin:22px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#end .stats div{display:flex;flex-direction:column;gap:4px;font:600 10px var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
#end .stats b{font:600 26px/1 var(--mono);color:var(--bone)}
#end .go{display:flex;gap:8px;justify-content:center}
#end .kh{margin-top:12px}
#end .epi{list-style:none;margin:6px auto 0;padding:0;max-width:440px;text-align:left}
#end .epi li{position:relative;padding:3px 0 3px 18px;font:500 14px/1.45 var(--body);color:#c9bea9;opacity:0;animation:lnin .8s forwards}
#end .epi li::before{content:'';position:absolute;left:2px;top:.85em;width:9px;height:2px;background:var(--ember)}

/* ---------- narrow screens / phones ---------- */
@media (max-width:760px){
  :root{--gut:10px}
  .hud-tc{top:calc(var(--sat) + 8px);left:calc(var(--sal) + 10px);right:calc(var(--sar) + 10px);transform:none;max-width:none}
  #obj{font-size:14px;line-height:1.25;padding:5px 10px 5px 6px;align-self:center;white-space:normal}
  #obj .tx{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
  #obj .ds{font-size:13px}
  .hud-tl,.hud-tr{top:calc(var(--sat) + 16px + var(--objh,30px))}
  .hud-tl{width:164px;gap:4px}
  #mm{width:96px;height:96px}
  #toasts{top:calc(var(--sat) + 16px + var(--objh,30px) + 146px);max-width:64vw}
  #toasts.nomap{top:calc(var(--sat) + 16px + var(--objh,30px) + 46px)}
  #banner .t{font-size:19px}
  #banner{margin-top:4px;position:relative;z-index:3;background:rgba(12,10,8,.94);max-width:none;align-self:stretch}
  .bar{grid-template-columns:14px 1fr 30px;gap:6px;font-size:13px}
  .bar .tr{height:7px}
  .clock{font-size:13px;gap:5px}
  .clock .ppl{margin-left:4px;padding-left:7px}
  .chip{font-size:13px;letter-spacing:.02em;padding:2px 5px}
  .wx{font-size:13px}
  #wmark .dl{font-size:13px}
  .ohp b{font-size:13px}
  .dn{font-size:16px}
  #prompt .tx .hl{font-size:13px;letter-spacing:.06em}
  #timer .lb{font-size:16px}
  #dlg{padding:12px 14px;bottom:calc(var(--sab) + 10px)}
  #dlg .ln{font-size:16px}
  #dlg .ch button .num{font-size:13px}
  #dlg .ch button .note,#dlg .nx button,#dlg .tag{font-size:13px}
  #dlg .ch{max-height:44vh}
  .ph .sub,.tabs button,.wbar,.xp,.kv,.legend,.bt h4,.offer h4,.mini .pr,.mini button .q,.it .q,.row .cost,.why,.lv,.fx,.logl,.pts,.bst,.jt .d,.help span:last-child,#mg .s,#mg .st,#end .ey,#end .stats div,#title .ver,.newg label,.bgc em,.offer .tok b,.it .eq{font-size:13px}
  .tabs button{padding:10px 8px 8px;letter-spacing:.06em}
  .it .n,.bgc span{font-size:13px}
  #pnl-wrap{padding:calc(var(--sat) + 6px) calc(var(--sar) + 6px) calc(var(--sab) + 6px) calc(var(--sal) + 6px)}
  #pnl{max-height:100%;height:100%}
  #pnl.narrow{height:auto}
  .ph h2{font-size:22px}
  .pb-body{padding:12px 12px 16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr))}
  .cols,.bt{grid-template-columns:1fr 1fr;gap:8px}
  .help{grid-template-columns:1fr}
  .bgs{grid-template-columns:1fr 1fr}
  .bgc{min-height:0;padding:8px 10px}
  .wrow{flex-wrap:wrap;gap:8px;padding:9px 10px}
  .wrow .wa{width:100%;justify-content:flex-end}
  .wrow .wi b{font-size:18px}
  .wrow .wi em,.cmp,.cmp .md,.ctag,.wrow .mtag,.wrow .q{font-size:13px}
  .newg .names{gap:8px}

  .attr{grid-template-columns:36px 1fr auto 38px;gap:8px}
  #hint{top:auto;bottom:calc(var(--sab) + 236px);font-size:14px}
  body:not(.touch) #hint{bottom:calc(var(--sab) + 170px)}
  .arc{grid-template-columns:1fr 90px}
}
@media (max-width:420px){
  .bgs{grid-template-columns:1fr 1fr}
  .bgc b{font-size:16px}
  #title .tag{margin:14px 0 22px;font-size:13px;letter-spacing:.12em}
  .offer{grid-template-columns:1fr 1fr;padding:8px}
}
/* phones and touch: the top-right buttons become compact icon buttons */
body.touch .hb{width:38px;height:38px;padding:0;justify-content:center}
body.touch .hb svg{display:block}
body.touch .hb .lb,body.touch .hb .hk{display:none}
@media (max-width:760px){
  .hb{width:38px;height:38px;padding:0;justify-content:center}
  .hb svg{display:block}
  .hb .lb,.hb .hk{display:none}
}
@media (prefers-reduced-motion:reduce){
  *:not(#flash),*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .embers{display:none}
  #lvl .in{animation:none!important}
  body.lowhp #edge{opacity:.75}
  #lock i{animation:none!important}
}
@media (max-height:520px) and (orientation:landscape){
  #title .tag{margin:10px 0 14px}
  #dlg .ln{min-height:0}
  #t-pack{display:none}
}
