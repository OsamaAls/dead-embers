<title>Dead Embers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--soot:#12100e;--panel:#1c1814;--line:#3e352c;--bone:#ebe1ce;--dim:#a39683;--ember:#e8742c;--display:'Big Shoulders Stencil Display',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;color-scheme:dark}[hidden]{display:none!important}html,body{height:100%;margin:0}body{background:var(--soot);color:var(--bone);font:15px/1.5 var(--body);overflow:hidden}#app{position:fixed;inset:0}#view{position:absolute;inset:0}#view canvas{display:block;touch-action:none}#hud{position:absolute;top:10px;left:10px;font:600 12px var(--mono);background:#0008;padding:6px 10px;pointer-events:none}#prompt{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);font:600 14px var(--mono);color:var(--ember)}#toasts{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none}.toast{background:#000a;padding:4px 8px;font-size:13px}#modal-wrap{position:absolute;inset:0;display:grid;place-items:center;background:#0008;z-index:10}#modal{background:var(--panel);border:1px solid var(--line);padding:16px;max-width:520px;display:flex;flex-direction:column;gap:6px}#modal button{text-align:left;padding:8px;background:#26201a;color:var(--bone);border:1px solid var(--line)}
</style>
<div id="app"><div id="view"></div><div id="hud"></div><div id="prompt"></div><div id="toasts"></div><div id="modal-wrap" hidden><div id="modal"></div></div></div>
