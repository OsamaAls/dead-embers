<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Embers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 2D world canvas; HUD pinned to edges like a scavenger's field kit; story & choices in a central dossier modal. Single dark world by design. */
:root {
  --soot: #12100e;
  --panel: #1c1814;
  --panel-2: #26201a;
  --line: #3e352c;
  --bone: #ebe1ce;
  --dim: #a39683;
  --ember: #e8742c;
  --ember-2: #f3a15a;
  --blood: #c0392e;
  --fever: #95b443;
  --water: #5b9cc4;
  --good: #8dbd6a;
  --warn: #e0b04a;
  --display: 'Big Shoulders Stencil Display', 'Impact', 'Arial Narrow', sans-serif;
  --body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Consolas', monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--soot); color: var(--bone); font: 15px/1.5 var(--body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; background: var(--soot); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
.hud { position: absolute; z-index: 5; pointer-events: none; }
.hud > * { pointer-events: auto; }
#hud-top { top: 10px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; pointer-events: none; }
.kit { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; backdrop-filter: blur(3px); }
#vitals { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 8px; align-items: center; min-width: 210px; font: 600 11px/1 var(--mono); }
#vitals .lab { color: var(--dim); letter-spacing: .08em; }
#vitals .bar { height: 7px; background: #0a0908; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; min-width: 90px; }
#vitals .bar i { display: block; height: 100%; width: 100%; transform-origin: left center; transition: transform .3s; }
#vitals .num { color: var(--bone); font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
#clockbox { display: flex; flex-direction: column; gap: 2px; }
#clock { font: 800 22px/1 var(--display); letter-spacing: .04em; }
#clock small { font: 600 11px var(--mono); color: var(--dim); margin-left: 6px; letter-spacing: .08em; }
#chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 6px; border-radius: 2px; border: 1px solid currentColor; }
.chip.bad { color: var(--blood); } .chip.fever { color: var(--fever); } .chip.warn { color: var(--warn); } .chip.good { color: var(--good); }
#objective { flex: 1 1 260px; max-width: 460px; font-size: 13px; line-height: 1.35; }
#objective b { display: block; font: 800 12px/1 var(--display); letter-spacing: .14em; color: var(--ember); margin-bottom: 3px; text-transform: uppercase; }
#minimap { margin-left: auto; padding: 4px; }
#minimap canvas { display: block; width: 160px; height: 120px; image-rendering: pixelated; }
#hud-btns { right: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.hbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px 12px; font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
.hbtn:hover { border-color: var(--ember); color: var(--ember-2); }
.hbtn kbd { font: inherit; color: var(--dim); margin-left: 4px; }
.hbtn.on { background: var(--ember); color: #1a0f07; border-color: var(--ember); }
.hbtn.on kbd { color: #1a0f07; }
.hbtn.alert { border-color: var(--warn); color: var(--warn); }
#ticker { left: 10px; bottom: 10px; max-width: min(520px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
#ticker div { font-size: 13px; background: color-mix(in srgb, var(--soot) 75%, transparent); padding: 2px 8px; border-left: 2px solid var(--line); animation: tick 6s forwards; }
#ticker .good { border-color: var(--good); } #ticker .bad { border-color: var(--blood); color: #f0b8b0; } #ticker .warn { border-color: var(--warn); } #ticker .story { border-color: var(--ember); color: var(--ember-2); }
@keyframes tick { 0%, 80% { opacity: 1 } 100% { opacity: .35 } }
#hint { left: 50%; transform: translateX(-50%); bottom: 64px; font: 600 12px var(--mono); color: var(--dim); letter-spacing: .05em; text-align: center; pointer-events: none; }
#flash { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(192,57,46,.55)); opacity: 0; transition: opacity .4s; }

/* Modal dossier */
#modal-wrap { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(8,6,5,.72); }
#modal { width: min(680px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,.6); padding: 22px 24px; position: relative; }
#modal.wide { width: min(980px, 100%); }
#modal::before { content: ''; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: repeating-linear-gradient(-45deg, var(--ember) 0 10px, #1a0f07 10px 20px); border-radius: 6px 6px 0 0; }
.eyebrow { font: 600 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--ember); margin-bottom: 8px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; letter-spacing: .03em; text-wrap: balance; margin: 0; line-height: 1; }
h2 { font-size: 34px; margin-bottom: 12px; }
h3 { font-size: 20px; margin: 18px 0 8px; color: var(--ember-2); letter-spacing: .06em; }
.prose p { margin: 0 0 12px; max-width: 62ch; font-size: 16px; }
.prose p:first-child::first-letter { font-family: var(--display); font-size: 1.6em; color: var(--ember); }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.choice { text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 11px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; transition: border-color .15s, transform .1s; }
.choice:hover:not(:disabled) { border-color: var(--ember); transform: translateX(3px); }
.choice:disabled { opacity: .45; cursor: not-allowed; }
.choice .odds { font: 600 11px var(--mono); letter-spacing: .05em; color: var(--dim); white-space: nowrap; }
.choice .odds b { color: var(--bone); }
.odds.hi b { color: var(--good) !important; } .odds.lo b { color: var(--blood) !important; }
.result-tag { display: inline-block; font: 800 14px/1 var(--display); letter-spacing: .14em; padding: 5px 10px; border-radius: 2px; margin-bottom: 10px; }
.result-tag.ok { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.result-tag.no { background: color-mix(in srgb, var(--blood) 22%, transparent); color: #f08a80; }
.deltas { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.btn { background: var(--ember); color: #1a0f07; border: 0; border-radius: 4px; padding: 10px 18px; font: 800 16px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; }
.btn:hover { background: var(--ember-2); }
.btn.ghost { background: transparent; color: var(--bone); border: 1px solid var(--line); }
.btn.ghost:hover { border-color: var(--ember); color: var(--ember-2); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.sm { font-size: 13px; padding: 7px 11px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; margin-top: 18px; }
.muted { color: var(--dim); }
.mono { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; flex-wrap: wrap; }
.tab { background: none; border: 0; padding: 8px 12px; font: 800 15px/1 var(--display); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--ember-2); border-color: var(--ember); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card h4 { margin: 0; font: 800 18px/1 var(--display); letter-spacing: .04em; }
.card .lv { font: 600 11px var(--mono); color: var(--ember); letter-spacing: .08em; }
.card.sel { border-color: var(--ember); box-shadow: inset 0 0 0 1px var(--ember); }
.cost { display: flex; flex-wrap: wrap; gap: 4px; }
.cost span { font: 500 11px var(--mono); padding: 2px 5px; border-radius: 2px; background: #0f0d0b; border: 1px solid var(--line); }
.cost span.miss { color: var(--blood); border-color: color-mix(in srgb, var(--blood) 50%, var(--line)); }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 8px; padding: 7px 2px; border-bottom: 1px dashed var(--line); }
.li .nm { flex: 1; min-width: 0; }
.li .q { font: 600 12px var(--mono); color: var(--dim); min-width: 34px; text-align: right; }
.cat { font: 600 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin: 12px 0 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.meter { height: 8px; background: #0a0908; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ember); }
select, input[type=text] { background: #0f0d0b; color: var(--bone); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: inherit; }
input[type=text] { font-size: 18px; width: 100%; }
.attr-row { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.attr-row .v { font: 800 22px/1 var(--display); min-width: 24px; text-align: center; }
.stepper { display: flex; gap: 4px; align-items: center; }
.stepper button { width: 28px; height: 28px; border-radius: 3px; border: 1px solid var(--line); background: var(--panel-2); font-weight: 700; }
.foe { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; background: color-mix(in srgb, var(--blood) 12%, var(--panel-2)); border: 1px solid color-mix(in srgb, var(--blood) 45%, var(--line)); border-radius: 3px; }
.foe b { font: 800 17px var(--display); letter-spacing: .05em; }
.narr { font-size: 15px; margin: 0; padding-left: 16px; }
.narr li { margin: 3px 0; }
.radio { font-family: var(--mono); font-size: 13px; background: #0d0c0a; border: 1px solid color-mix(in srgb, var(--water) 40%, var(--line)); padding: 10px 12px; color: #bcd6e6; margin-top: 12px; }
.sumline { padding: 5px 0; border-bottom: 1px dashed var(--line); }
.sumline.good { color: var(--good); } .sumline.bad { color: #f08a80; } .sumline.warn { color: var(--warn); }

/* Title */
#title { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background:
  radial-gradient(ellipse at 50% 120%, rgba(232,116,44,.28), transparent 60%), var(--soot); overflow: auto; }
#title .wrap { text-align: center; max-width: 560px; }
#title h1 { font-size: clamp(64px, 14vw, 140px); line-height: .85; letter-spacing: .02em; color: var(--bone); }
#title h1 span { display: block; color: var(--ember); }
#title p { color: var(--dim); font-size: 16px; margin: 18px auto 26px; max-width: 46ch; }
#title .embers { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#title .embers i { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: var(--ember-2); box-shadow: 0 0 6px var(--ember); animation: rise linear infinite; }
@keyframes rise { to { transform: translate(var(--dx), -105vh); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #title .embers { display: none; } .choice { transition: none; } }

@media (max-width: 720px) {
  #hud-top { top: 6px; left: 6px; right: 6px; gap: 6px; }
  #vitals { min-width: 0; flex: 1 1 100%; grid-template-columns: auto 1fr auto auto 1fr auto; }
  #vitals .bar { min-width: 40px; }
  #objective { flex-basis: 100%; font-size: 12px; }
  #minimap { display: none; }
  #ticker { bottom: 58px; left: 6px; }
  #ticker div:nth-child(-n+2) { display: none; }
  #hud-btns { right: 6px; left: 6px; bottom: 6px; justify-content: center; }
  .hbtn { padding: 9px 9px; font-size: 11px; }
  .hbtn kbd { display: none; }
  #hint { display: none; }
  h2 { font-size: 28px; }
  #modal { padding: 18px 16px; }
  .two { grid-template-columns: 1fr; }
}
</style>

</head><body style="margin:0">
<div id="app">
  <canvas id="cv"></canvas>
  <div id="flash"></div>
  <div class="hud" id="hud-top">
    <div class="kit" id="vitals"></div>
    <div class="kit" id="clockbox"><div id="clock"></div><div id="chips"></div></div>
    <div class="kit" id="objective"></div>
    <div class="kit" id="minimap"><canvas id="mm" width="160" height="120"></canvas></div>
  </div>
  <div class="hud" id="ticker"></div>
  <div class="hud" id="hint">WASD / arrows to move · Shift to sprint · tap or click to walk · walk into doors to enter</div>
  <div class="hud" id="hud-btns">
    <button class="hbtn" id="b-sprint">Sprint</button>
    <button class="hbtn" id="b-pack">Pack<kbd>I</kbd></button>
    <button class="hbtn" id="b-char">Survivor<kbd>C</kbd></button>
    <button class="hbtn" id="b-journal">Journal<kbd>J</kbd></button>

  <div id="title">
    <div class="embers" id="embers"></div>
    <div class="wrap">
      <div class="eyebrow">Ardent Vale · 14 months after the Grey Fever</div>
      <h1>Dead<span>Embers</span></h1>
      <p>The dead own the streets. You own a hole in the ground, a broken radio, and whatever you can carry. Keep the fire going.</p>
      <div class="row" style="justify-content:center" id="title-btns"></div>
    </div>
  </div>
</div>
<script>
/* ---- data.js ---- */
/* ===================== DATA ===================== */
const ITEMS = {

/* loot: [id, weight, min, max]; story: item obtainable here when quest allows */
const LOCS = {
  shelter:{n:'Metro Bunker',icon:'🚇',danger:0,desc:'A maintenance bunker under the old Line 3. Thick concrete, one steel door. Home.'},

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rnd(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function chance(p) { return Math.random() < p; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function wpick(list, wf) { const tot = list.reduce((s, x) => s + wf(x), 0); let r = Math.random() * tot; for (const x of list) { r -= wf(x); if (r <= 0) return x; } return list[list.length - 1]; }
function itemName(id) { return (ITEMS[id] && ITEMS[id].n) || id; }

    let fed = 0;

    }

    if (fed < need) { hungry++; s.hp -= 15; s.morale -= 15; } else { s.hp = Math.min(100, s.hp + 8); s.morale += 3; }
    if (!wat) { thirsty++; s.hp -= 20; s.morale -= 15; }
    if (G.survivors.length > shelterCap()) s.morale -= 5;

    else {

      const b1 = damageBuilding(); if (b1) P(`${b1} was wrecked.`, 'bad');

      for (const s of G.survivors) if (chance(0.3)) s.hp -= rnd(15, 35);
      if (S - D > 15 && G.survivors.length) { const v = pick(G.survivors); killSurvivor(v, 'the horde'); P(`${v.name} was dragged into the dark.`, 'bad'); }
      for (const f of ['canned', 'veg', 'meal']) if (G.store[f]) G.store[f] = Math.floor(G.store[f] * 0.7);

  // player morale

  G.p.morale = clamp(G.p.morale + pm, 0, 100);
  G.atShelter = saveAt;
  // radio
  let radio = null; const C = CONTENT_();
  if (G.flags.radio_built && C.radio.length) radio = C.radio[(G.day - 1) % C.radio.length];
  Hooks.queue({ type: 'summary', lines: R, radio, day: G.day });
  if (saveAt && G.day > 1 && C.shelterEvents.length && chance(0.45)) { const ev = pickEncounter('shelter'); if (ev) Hooks.queue({ type: 'enc', enc: ev }); }
  storyCheck();
  if (G.p.morale <= 0) { G.endScene = 'abandoned'; Hooks.queue({ type: 'end', id: 'abandoned' }); }
  saveGame(true);
}

/* ---------- Actions ---------- */
function eat(id) {
  const it = ITEMS[id]; if (!it || !take(id, 1)) return;
  const e = it.eat || {}, u = it.use || {}; const out = [];
  if (e.hunger) out.push(feed(e.hunger)); if (e.thirst) out.push(drink(e.thirst));
  if (e.sta) out.push(rest(e.sta)); if (e.morale) out.push(addMorale(e.morale));
  if (e.sick && chance(e.sick * (G.flags.iron_gut ? 0.5 : 1))) { setStatus('sick', 18); out.push('you feel sick'); }
  const medMul = 1 + (A('int') - 3) * 0.06;
  if (u.hp) out.push(heal(u.hp * medMul)); if (u.sta) out.push(rest(u.sta));

}
function searchLoc(key) {

  advance(90); tire(10); G.stats.searches++; st.visited = true;
  if (G.p.hp <= 0) return { text: '' };
  const depleted = st.left <= 0;
  if (!depleted) st.left--;
  const per = A('per');
  let rolls = Math.round((2 + rnd(0, 2)) * (1 + per * 0.12) * (G.isNight ? 1.25 : 1) * (depleted ? 0.3 : 1));
  const got = {};
  for (let i = 0; i < rolls; i++) { const e = wpick(L.loot, x => x[1]); got[e[0]] = (got[e[0]] || 0) + rnd(e[2], e[3]); }
  if (L.rare && !depleted && chance(0.04 + per * 0.015)) { const r = pick(L.rare); got[r] = (got[r] || 0) + 1; }
  const out = [];

  // story items

  if (sItem && (st.storyTries = (st.storyTries || 0) + 1) && (st.storyTries >= 2 || chance(0.5))) { out.push(give(sItem, 1)); setFlag('got_' + sItem.replace('radio_', '')); log(`Found the ${itemName(sItem)}!`, 'story'); xp(20); }
  // lore

  if (unread.length && chance(0.16)) { const i = pick(unread); G.loreRead.push(i); lore = C.lore[i]; journal(lore.title, lore.text); }
  xp(4); addNoise(1);
  let text = depleted ? 'This place is picked clean. You scrape together a little.' : pick(['You work through the rooms carefully.', 'You search every drawer and shelf.', 'You move quietly, checking corners.', 'You pry open what you can.']);
  // encounter

}
function storyItemHere(type) {

function sleep() {

/* ---------- Encounters ---------- */
function allEncounters() { return [].concat(window.ENCOUNTERS || [], window.ARC_ENCOUNTERS || [], CONTENT_().shelterEvents || []); }
function encEligible(e, type, ignoreWhere) {
  if (!ignoreWhere) {
    const w = e.where || ['any'];
    if (type === 'shelter') { if (!w.includes('shelter')) return false; }
    else if (!(w.includes(type) || w.includes('any') || (type === 'travel-any' && w.includes('travel')))) return false;
  }
  if (e.minDay && G.day < e.minDay) return false;
  if (e.night === true && !G.isNight) return false;
  if (e.night === false && G.isNight) return false;
  if (e.once && G.seenEnc[e.id]) return false;
  if (e.cond) { try { if (!e.cond()) return false; } catch (err) { return false; } }
  return true;
}
function pickEncounter(type) {
  const all = allEncounters();
  let pool = all.filter(e => encEligible(e, type));
  if (type !== 'shelter' && type !== 'travel') {
    // mix location-specific with travel/any; boost exact matches
    pool = pool.concat(all.filter(e => (e.where || []).includes('travel') && !pool.includes(e) && encEligible(e, 'travel')));
  }
  if (!pool.length) return null;
  return wpick(pool, e => (e.weight || 10) * ((e.where || []).includes(type) ? 2 : 1) * (G.seenEnc[e.id] ? 0.5 : 1));
}
function encById(id) { return allEncounters().find(e => e.id === id); }
function checkChance(c) { return clamp(0.6 + (A(c.attr) - c.diff) * 0.09, 0.05, 0.95); }

/* ---------- Fights (quick, narrated) ---------- */
function fightOdds(ids, mode) {
  const w = weaponOf(); const ranged = w && ITEMS[w].ammo;
  let P = (w ? avgDmg(w) : 2.5) + A('str') * (ranged ? 0.3 : 1) + A('agi') * 0.7 + G.p.level + (G.p.sta / 30) + (G.p.hp / 25);
  if (mode === 'shoot') P *= 1.7;
  const E = ids.reduce((s, id) => s + ENEMIES[id].hp / 3 + (ENEMIES[id].dmg[0] + ENEMIES[id].dmg[1]) / 2, 0);
  return clamp(P / (P + E * 0.9), 0.1, 0.95);
}
function fleeChance(ids) { const worst = Math.min(...ids.map(i => ENEMIES[i].flee)); return clamp(worst * (0.55 + A('agi') * 0.06) * (G.p.sta > 15 ? 1 : 0.6), 0.05, 0.95); }
function resolveFight(ids, mode) {
  const lines = [], foes = ids.map(id => ({ id, e: ENEMIES[id], hp: ENEMIES[id].hp }));
  let w = weaponOf(); const it = w ? ITEMS[w] : null;
  const shooting = mode === 'shoot' && it && it.ammo && G.pack[it.ammo];
  const meleeW = shooting ? null : (it && !it.ammo ? w : (Object.keys(G.pack).filter(k => ITEMS[k].c === 'weapon' && !ITEMS[k].ammo).sort((a, b) => avgDmg(b) - avgDmg(a))[0] || null));
  const armor = G.pack.vest ? 3 : 0;
  let dmgTaken = 0, bitten = false, gassed = false, kills = 0, round = 0;
  while (foes.some(f => f.hp > 0) && round < 14 && G.p.hp - dmgTaken > 0) {
    round++;
    const target = foes.find(f => f.hp > 0);
    const hitC = 0.72 + A('agi') * 0.02;
    if (chance(hitC)) {
      let d;
      if (shooting) { d = rnd(it.dmg[0], it.dmg[1]); G.pack[it.ammo]--; if (!G.pack[it.ammo]) delete G.pack[it.ammo]; addNoise(it.noise); }
      else { const md = meleeW ? ITEMS[meleeW].dmg : [2, 4]; d = rnd(md[0], md[1]) + Math.round(A('str') * 0.6); if (G.p.sta < 5) d = Math.round(d * 0.6); }
      target.hp -= d;
      const wn = shooting ? it.n : (meleeW ? ITEMS[meleeW].n : 'bare fists');
      if (target.hp <= 0) {
        kills++; lines.push(`You drop the ${target.e.n} with your ${wn}.`);
        if (target.e.gas && !shooting) { gassed = true; lines.push('It bursts. Green gas fills your lungs.'); }
        if (shooting && it.aoe) { const t2 = foes.find(f => f.hp > 0); if (t2) { t2.hp -= Math.round(d / 2); lines.push(`The spread tears into the ${t2.e.n} behind it.`); if (t2.hp <= 0) kills++; } }
      } else if (round <= 3) lines.push(`You hit the ${target.e.n} with your ${wn}.`);
      if (!shooting && !G.pack.ammo) tire(3); else tire(2);
    } else if (round <= 4) lines.push(`You swing and miss the ${target.e.n}.`);
    // screamer
    const sc = foes.find(f => f.hp > 0 && f.e.scream);
    if (sc && chance(0.35) && foes.length < 7) { foes.push({ id: 'walker', e: ENEMIES.walker, hp: ENEMIES.walker.hp }); lines.push('The Screamer shrieks. Another walker stumbles in.'); addNoise(2); }
    // enemies attack
    for (const f of foes) {

      if (chance(f.e.acc - A('agi') * 0.025)) {
        const d = Math.max(1, rnd(f.e.dmg[0], f.e.dmg[1]) - armor); dmgTaken += d;
        if (f.e.z && chance(G.pack.vest ? 0.05 : 0.1)) bitten = true;
      }

  lines.push(won ? `It's over. You took ${dmgTaken} damage.` : `You are overwhelmed.`);
  hurt(dmgTaken, 'a fight with ' + ENEMIES[ids[0]].n.toLowerCase() + 's');
  if (G.p.hp <= 0) return { won: false, lines, dead: true };
  if (!won) { const extra = ''; lines.push('You break away and run, bleeding.'); setStatus('bleeding', 4); }
  if (dmgTaken > 20 && chance(0.4)) { setStatus('bleeding', 5); lines.push('You are bleeding.'); }
  if (gassed) setStatus('sick', 16);
  if (bitten) lines.push(bite());
  const loot = [];
  if (won) {
    const xpg = foes.reduce((s, f) => s + f.e.xp, 0); xp(xpg);
    for (const f of foes) if (f.e.loot && chance(0.7)) { const l = pick(f.e.loot); loot.push(give(l[0], rnd(1, l[1]))); }
  }
  return { won, lines, loot: loot.filter(Boolean) };
}

/* ---------- Modal system ---------- */
function showModal(html, wide) { const m = $('#modal'); m.className = wide ? 'wide' : ''; m.innerHTML = html; $('#modal-wrap').hidden = false; UI.open = true; m.scrollTop = 0; const b = m.querySelector('.btn, .choice:not(:disabled)'); if (b) setTimeout(() => b.focus({ preventScroll: true }), 30); }
function closeModal() { $('#modal-wrap').hidden = true; UI.open = false; UI.invuln = 1.6; UI.keys = {}; refreshHUD(); storyCheck(); nextModal(); }
function nextModal() {
  if (UI.open) return;
  if (G && G.dead && !(UI.q[0] && UI.q[0].type === 'end')) UI.q = [{ type: 'end', id: 'death' }];
  const it = UI.q.shift(); if (!it) return;
  if (it.type === 'scene') showScene(it.id);
  else if (it.type === 'enc') showEnc(it.enc);
  else if (it.type === 'summary') showSummary(it);
  else if (it.type === 'final') showFinal();
  else if (it.type === 'end') showEnd(it.id);
  else if (it.type === 'fight') showFight(it.ids, it.opts, it.intro);
  else if (it.type === 'trader') showTrader();
  else if (it.type === 'fn') it.fn();
}
function bind(sel, fn) { const m = $('#modal'); m.querySelectorAll(sel).forEach(el => el.addEventListener('click', e => fn(el, e))); }
function fmtName(s) { return String(s).replace(/\{name\}/g, G ? G.p.name : 'Survivor'); }

/* ---------- Snapshots for showing consequences ---------- */
function snap() { return { hp: G.p.hp, sta: G.p.sta, hunger: G.p.hunger, thirst: G.p.thirst, morale: G.p.morale, inf: G.p.inf, items: Object.assign({}, G.pack), store: Object.assign({}, G.store), surv: G.survivors.length, xp: G.p.xp + G.p.level * 1000 }; }
function deltaChips(a) {
  const b = snap(), out = [];
  const d = (k, lab, cls) => { const v = Math.round(b[k] - a[k]); if (v) out.push(`<span class="chip ${v > 0 ? (cls === 'inv' ? 'bad' : 'good') : (cls === 'inv' ? 'good' : 'bad')}">${v > 0 ? '+' : ''}${v} ${lab}</span>`); };
  d('hp', 'HP'); d('sta', 'Stamina'); d('hunger', 'Food'); d('thirst', 'Water'); d('morale', 'Morale'); d('inf', 'Infection', 'inv'); d('surv', 'Survivor');
  const keys = new Set([...Object.keys(a.items), ...Object.keys(b.items), ...Object.keys(a.store), ...Object.keys(b.store)]);
  for (const k of keys) { const v = ((b.items[k] || 0) + (b.store[k] || 0)) - ((a.items[k] || 0) + (a.store[k] || 0)); if (v) out.push(`<span class="chip ${v > 0 ? 'good' : 'warn'}">${v > 0 ? '+' : ''}${v} ${esc(itemName(k))}</span>`); }
  return out.length ? `<div class="deltas">${out.join('')}</div>` : '';
}

/* ---------- Encounters ---------- */
function safe(fn, fallback) { try { const r = fn(); return r; } catch (e) { console.error(e); return fallback; } }
function showEnc(enc) {
  G.seenEnc[enc.id] = (G.seenEnc[enc.id] || 0) + 1; G.stats.encounters++;
  const text = typeof enc.text === 'function' ? safe(enc.text, '...') : enc.text;
  const choices = enc.choices.map((c, i) => {
    const ok = !c.req || safe(c.req, false);
    let odds = '';
    if (c.check) { const p = Math.round(checkChance(c.check) * 100); odds = `<span class="odds ${p >= 70 ? 'hi' : p < 40 ? 'lo' : ''}">${c.check.attr.toUpperCase()} check · <b>${p}%</b></span>`; }
    if (!ok) odds = `<span class="odds">${esc(c.reqText || 'Unavailable')}</span>`;
    return `<button class="choice" data-i="${i}" ${ok ? '' : 'disabled'}><span>${esc(c.label)}</span>${odds}</button>`;
  }).join('');
  const where = G.atShelter ? 'The bunker' : (UI.curPoi ? UI.curPoi.label : LOCS[districtAt(G.p.x, G.p.y)].n);
  showModal(`<div class="eyebrow">Encounter · ${esc(where)} · ${G.isNight ? 'Night' : 'Day'}</div><h2>${esc(enc.title)}</h2>
    <div class="prose"><p>${esc(fmtName(text))}</p></div><div class="choices">${choices}</div>`);
  bind('.choice', el => {
    const c = enc.choices[+el.dataset.i];
    const before = snap(); PENDING = { fight: null, trader: false };
    let pass = true, p = null;
    if (c.check) { p = checkChance(c.check); pass = Math.random() < p; }
    let res = safe(pass ? (c.success || (() => '')) : (c.fail || c.success || (() => '')), 'Something went wrong.');
    if (typeof res !== 'string') res = '';
    xp(3);
    const tag = c.check ? `<div class="result-tag ${pass ? 'ok' : 'no'}">${pass ? 'SUCCESS' : 'FAILED'} · ${Math.round(p * 100)}%</div>` : '';
    showModal(`<div class="eyebrow">Encounter · ${esc(enc.title)}</div><h2>${esc(c.label)}</h2>${tag}
      <div class="prose"><p>${esc(fmtName(res))}</p></div>${deltaChips(before)}
      <div class="row end"><button class="btn" id="m-ok">${PENDING.fight ? 'Fight' : PENDING.trader ? 'Trade' : 'Continue'}</button></div>`);
    bind('#m-ok', () => {
      if (G.dead) return closeModal();
      if (PENDING.fight) { const f = PENDING.fight; PENDING.fight = null; UI.q.unshift({ type: 'fight', ids: f.ids, opts: f.opts }); }
      else if (PENDING.trader) { PENDING.trader = false; UI.q.unshift({ type: 'trader' }); }
      closeModal();
    });
    refreshHUD();
  });
}

/* ---------- Quick fights ---------- */
function showFight(ids, opts, intro) {
  opts = opts || {};
  const w = weaponOf(), it = w ? ITEMS[w] : null;
  const canShoot = it && it.ammo && G.pack[it.ammo];
  const anyGun = Object.keys(G.pack).find(k => ITEMS[k].ammo && G.pack[ITEMS[k].ammo]);
  if (!canShoot && anyGun) G.p.weapon = anyGun;
  const gun = G.p.weapon && ITEMS[G.p.weapon].ammo && G.pack[ITEMS[G.p.weapon].ammo] ? G.p.weapon : null;
  const human = ids.every(i => !ENEMIES[i].z);
  const counts = {}; ids.forEach(i => counts[i] = (counts[i] || 0) + 1);
  const foes = Object.keys(counts).map(i => `<div class="foe"><b>${esc(ENEMIES[i].n)}${counts[i] > 1 ? ' ×' + counts[i] : ''}</b><span class="muted">${esc(ENEMIES[i].desc || '')}</span></div>`).join('');
  const pc = (p) => `<span class="odds ${p >= 0.7 ? 'hi' : p < 0.4 ? 'lo' : ''}"><b>${Math.round(p * 100)}%</b></span>`;
  const melee = Object.keys(G.pack).filter(k => ITEMS[k].c === 'weapon' && !ITEMS[k].ammo).sort((a, b) => avgDmg(b) - avgDmg(a))[0];
  let html = `<div class="eyebrow">Fight · Day ${G.day}</div><h2>${human ? 'Ambush' : 'The dead are on you'}</h2>
    ${intro ? `<div class="prose"><p>${esc(intro)}</p></div>` : ''}<div class="list" style="gap:6px">${foes}</div><div class="choices">
    <button class="choice" data-a="melee"><span>Fight with ${esc(melee ? ITEMS[melee].n : 'your bare hands')}</span>${pc(fightOdds(ids, 'melee'))}</button>`;
  if (gun) html += `<button class="choice" data-a="shoot"><span>Shoot (${esc(ITEMS[gun].n)}, ${G.pack[ITEMS[gun].ammo]} ${esc(itemName(ITEMS[gun].ammo))}${ITEMS[gun].noise ? ', loud' : ''})</span>${pc(fightOdds(ids, 'shoot'))}</button>`;
  if (human) html += `<button class="choice" data-a="talk"><span>Talk them down</span><span class="odds">CHA check · <b>${Math.round(checkChance({ attr: 'cha', diff: 6 + ids.length - 1 }) * 100)}%</b></span></button>`;
  if (!opts.noFlee) html += `<button class="choice" data-a="flee"><span>Run for it</span>${pc(fleeChance(ids))}</button>`;
  html += `</div><p class="muted mono" style="margin-top:12px">Odds include your weapon, STR, AGI, health and stamina.</p>`;
  showModal(html);
  bind('.choice', el => {
    const a = el.dataset.a, before = snap();
    if (a === 'flee') {
      if (chance(fleeChance(ids))) { tire(8); addNoise(1); return fightResult('You got away', ['You break line of sight and keep running until your lungs burn.'], before); }
      hurt(rnd(4, 9), 'a failed escape'); if (G.dead) return closeModal();
      return showFight(ids, Object.assign({}, opts, { noFlee: true }), 'You stumble. They are on you. No running now.');
    }
    if (a === 'talk') {
      if (chance(checkChance({ attr: 'cha', diff: 6 + ids.length - 1 }))) { xp(10); return fightResult('Talked down', ['You keep your voice level and your hands visible. After a long moment, they lower their weapons and back off.'], before); }
      return showFight(ids, Object.assign({}, opts), 'They laugh at you. Then they charge.');
    }
    const r = resolveFight(ids, a === 'shoot' ? 'shoot' : 'melee');
    if (r.dead) return closeModal();
    let extra = '';
    if (r.won && opts.onWin) { const t = safe(opts.onWin, ''); if (typeof t === 'string') extra = t; }
    fightResult(r.won ? 'Victory' : 'Driven off', r.lines.concat(extra ? [extra] : []), before);
  });
}
function fightResult(title, lines, before) {
  showModal(`<div class="eyebrow">Fight · Aftermath</div><h2>${esc(title)}</h2><ul class="narr">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>${deltaChips(before)}
    <div class="row end"><button class="btn" id="m-ok">Continue</button></div>`);

  refreshHUD();
}

/* ---------- Zombie contact ---------- */
const ZMAP = { walker: ['walker_pack', 'corpse_pile', 'horde_edge', 'night_stalkers'], runner: ['lone_runner'], bloater: ['bloater_corridor'], screamer: ['screamer_cry'], brute: ['brute_block'], zdog: ['zdog_pack'] };
function zombieContact(z) {
  const near = UI.zombies.filter(o => o !== z && Math.hypot(o.x - z.x, o.y - z.y) < 2.2);
  UI.zombies = UI.zombies.filter(o => o !== z && !near.includes(o));
  const cands = (ZMAP[z.type] || []).map(encById).filter(e => e && encEligible(e, 'x', true));
  if (cands.length && chance(0.5)) return Hooks.queue({ type: 'enc', enc: pick(cands) });
  const ids = [z.type].concat(near.map(n => n.type)).slice(0, 4);
  const intro = { walker: 'A walker lurches out from behind a wreck, jaw working.', runner: 'Footsteps. Fast ones. A runner is sprinting straight at you.', bloater: 'A swollen bloater waddles into your path, skin stretched and glistening.', screamer: 'A pale screamer opens its mouth wide. You have seconds.', brute: 'The ground shakes. A brute turns its head toward you.', zdog: 'Snarling from the alley. An infected dog, ribs showing, comes low and fast.' }[z.type];
  Hooks.queue({ type: 'fight', ids, opts: {}, intro: intro + (near.length ? ` ${near.length} more follow it.` : '') });
}

  };
  return `<div class="two"><div><h3 style="margin-top:0">Your pack <span class="mono muted">${packWeight()}/${carryCap()} kg</span></h3>${rows(G.pack, 'in')}</div><div><h3 style="margin-top:0">Storage</h3>${rows(G.store, 'out')}</div></div>`;

function wireShelter(tab) {
  bind('#s-sleep', () => { sleep(); refreshHUD(); if (G.dead) return closeModal(); UI.q.push({ type: 'fn', fn: () => openShelter('base') }); closeModal(); });

    let n = 0;

/* ---------- Pack ---------- */
function openPack() {
  const ks = Object.keys(G.pack).sort((a, b) => (ITEMS[a].c + a).localeCompare(ITEMS[b].c + b));

    const it = ITEMS[k];

    let act = '';
    if (it.eat || it.use) act = `<button class="btn sm" data-use="${k}">${it.eat ? (it.c === 'water' ? 'Drink' : 'Eat') : 'Use'}</button>`;
    if (it.c === 'weapon') act = G.p.weapon === k ? '<span class="chip good">Equipped</span>' : `<button class="btn ghost sm" data-eq="${k}">Equip</button>`;
    const info = it.dmg ? ` <span class="mono muted">dmg ${it.dmg.join('–')}${it.ammo ? ', uses ' + itemName(it.ammo) : ''}</span>` : it.desc ? ` <span class="mono muted">${esc(it.desc)}</span>` : '';

/* ---------- HUD ---------- */
function bar(lab, v, max, color) { return `<span class="lab">${lab}</span><span class="bar"><i style="transform:scaleX(${clamp(v / max, 0, 1)});background:${color}"></i></span><span class="num">${Math.round(v)}</span>`; }
function refreshHUD() {
  if (!G) return;
  const p = G.p;
  $('#vitals').innerHTML = bar('HP', p.hp, p.maxHp, 'var(--blood)') + bar('STA', p.sta, p.maxSta, 'var(--ember)') + bar('FOOD', p.hunger, 100, 'var(--warn)') + bar('WATER', p.thirst, 100, 'var(--water)') + (p.inf > 0 ? bar('FEVER', p.inf, 100, 'var(--fever)') : bar('MOOD', p.morale, 100, 'var(--good)'));
  const tod = G.isNight ? 'NIGHT' : G.hour < 9 ? 'DAWN' : G.hour >= 18 ? 'DUSK' : 'DAY';
  $('#clock').innerHTML = `DAY ${G.day} · ${String(G.hour).padStart(2, '0')}:${String(G.minute).padStart(2, '0')}<small>${tod}</small>`;
  const chips = [];
  if (p.inf > 0) chips.push(`<span class="chip fever">Infected ${Math.round(p.inf)}%</span>`);
  if (p.status.bleeding) chips.push('<span class="chip bad">Bleeding</span>');
  if (p.status.sick) chips.push('<span class="chip fever">Sick</span>');
  if (p.status.injured) chips.push('<span class="chip bad">Injured</span>');
  if (p.hunger < 15) chips.push('<span class="chip bad">Starving</span>'); else if (p.hunger < 30) chips.push('<span class="chip warn">Hungry</span>');
  if (p.thirst < 15) chips.push('<span class="chip bad">Dehydrated</span>'); else if (p.thirst < 30) chips.push('<span class="chip warn">Thirsty</span>');
  if (p.sta < 10) chips.push('<span class="chip warn">Exhausted</span>');
  if (G.noise >= 4) chips.push('<span class="chip warn">Noisy</span>');
  if (p.points) chips.push(`<span class="chip good">+${p.points} point</span>`);
  if (packWeight() >= carryCap() - 0.5) chips.push('<span class="chip warn">Pack full</span>');
  $('#chips').innerHTML = chips.join('');
  $('#objective').innerHTML = `<b>Objective</b>${esc(objective())}`;
  $('#b-char').classList.toggle('alert', !!p.points);
  $('#b-rest').firstChild.textContent = G.atShelter ? 'Bunker' : 'Rest';
}

/* ---------- World update ---------- */
function camera() { return { x: G.p.x - VW / TS / 2, y: G.p.y - VH / TS / 2 }; }
function tryMove(o, dx, dy, r, isZ) {
  const nx = o.x + dx, ny = o.y + dy;
  const blocked = (x, y) => solidAt(x - r, y - r) || solidAt(x + r, y - r) || solidAt(x - r, y + r) || solidAt(x + r, y + r) || (isZ && inShelter(x, y));
  let moved = 0;
  if (!blocked(nx, o.y)) { o.x = nx; moved += Math.abs(dx); }
  if (!blocked(o.x, ny)) { o.y = ny; moved += Math.abs(dy); }
  return moved;
}
function update(dt) {
  if (!G || UI.open || !UI.running || G.dead) return;
  const p = G.p;

    ctx.strokeStyle = col; ctx.lineWidth = 3 * big; ctx.beginPath();
    ctx.moveTo(X + Math.cos(z.dir - 0.4) * 4, Y + Math.sin(z.dir - 0.4) * 4); ctx.lineTo(X + Math.cos(z.dir - 0.2) * 12 * big, Y + Math.sin(z.dir - 0.2) * 12 * big + wob);
    ctx.moveTo(X + Math.cos(z.dir + 0.4) * 4, Y + Math.sin(z.dir + 0.4) * 4); ctx.lineTo(X + Math.cos(z.dir + 0.2) * 12 * big, Y + Math.sin(z.dir + 0.2) * 12 * big - wob); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(X, Y, 7 * big, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.arc(X, Y, 7 * big, 0.5, 2.6); ctx.fill();
  }
  if (z.chase) { ctx.fillStyle = z.type === 'runner' ? '#ff4030' : '#d0402e'; ctx.beginPath(); ctx.arc(X + Math.cos(z.dir) * 4 * big, Y + Math.sin(z.dir) * 4 * big, 1.8, 0, 7); ctx.fill(); }
  if (z.type === 'screamer' && z.chase) { ctx.strokeStyle = `rgba(220,220,200,${0.3 + Math.sin(t / 80) * 0.2})`; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(X, Y, 14 + (t / 30) % 12, 0, 7); ctx.stroke(); }
}
function drawPlayer(X, Y, t) {
  const f = G.p.face || 0, bob = G.p.moving ? Math.sin(t / 90) * 1.2 : 0;
  const lg = ctx.createRadialGradient(X, Y, 0, X, Y, TS * 3); lg.addColorStop(0, 'rgba(243,161,90,.16)'); lg.addColorStop(1, 'rgba(243,161,90,0)'); ctx.fillStyle = lg; ctx.fillRect(X - TS * 3, Y - TS * 3, TS * 6, TS * 6);
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(X, Y + 8, 9, 3.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#4a3a2a'; ctx.beginPath(); ctx.arc(X - Math.cos(f) * 5, Y - Math.sin(f) * 5 + bob, 5, 0, 7); ctx.fill();
  ctx.fillStyle = '#d8c8a8'; ctx.beginPath(); ctx.arc(X, Y + bob, 8, 0, 7); ctx.fill();
  ctx.strokeStyle = '#e8742c'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#2a2018'; ctx.beginPath(); ctx.arc(X + Math.cos(f) * 4, Y + Math.sin(f) * 4 + bob, 2.4, 0, 7); ctx.fill();
  if (UI.invuln > 0 && Math.floor(t / 100) % 2) { ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(X, Y, 12, 0, 7); ctx.stroke(); }
}
function drawMinimap() {
  if (!G || !WORLD) return;
  const s = 160 / W, fog = G._fog;
  if (!UI.mmT || performance.now() - UI.mmT > 500) {
    UI.mmT = performance.now();
    const img = mctx.createImageData(W, H);
    for (let i = 0; i < W * H; i++) {
      let c = [11, 10, 9];
      if (fog[i]) { const tt = WORLD.tiles[i]; c = tt === T_ROAD || tt === T_CAR || tt === T_DOOR ? [70, 66, 60] : tt === T_WATER ? [30, 70, 90] : tt === T_BRIDGE ? [90, 70, 50] : tt === T_TREE ? [28, 60, 30] : tt === T_ROOF || tt === T_WALL ? [100, 80, 66] : tt === T_YARD ? [120, 80, 50] : tt === T_FIELD ? [80, 90, 40] : [40, 50, 32]; }
      img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
    }
    UI.mmImg = img;
  }
  const off = UI.mmOff || (UI.mmOff = document.createElement('canvas')); off.width = W; off.height = H; off.getContext('2d').putImageData(UI.mmImg, 0, 0);
  mctx.imageSmoothingEnabled = false; mctx.drawImage(off, 0, 0, 160, 120);
  for (const k in WORLD.pois) { const p = WORLD.pois[k]; const q = storyItemHere(p.type) || (p.type === 'depot' && G.flags.q_bus && !G.flags.bus_ready); if (!fog[p.y * W + p.x] && !q) continue; mctx.fillStyle = q ? '#f3a15a' : '#e8742c'; mctx.fillRect(p.x * s - 1.5, p.y * s - 1.5, q ? 4 : 3, q ? 4 : 3); }
  mctx.fillStyle = '#fff'; mctx.beginPath(); mctx.arc(G.p.x * s, G.p.y * s, 2.5, 0, 7); mctx.fill();
}

/* ---------- Loop ---------- */
let lastT = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  update(dt); draw(t); if (G && UI.running) drawMinimap();
  requestAnimationFrame(loop);
}

/* ---------- Title & creation ---------- */
function showTitle() {
  $('#title').hidden = false;
  const b = $('#title-btns');
  b.innerHTML = (hasSave() ? '<button class="btn" id="t-cont">Continue</button>' : '') + `<button class="btn ${hasSave() ? 'ghost' : ''}" id="t-new">New game</button>`;
  if ($('#t-cont')) $('#t-cont').onclick = () => { if (loadGame()) { $('#title').hidden = true; startPlay(); } };
  $('#t-new').onclick = () => showCreate();
}
function showCreate() {
  const C = CONTENT_();
  const st = { name: pick(C.names.first || ['Sam']), bg: 'scavenger', a: { str: 3, end: 3, per: 3, cha: 3, agi: 3, int: 3 }, pts: 8 };
  const render = () => {
    const bgB = BACKGROUNDS[st.bg].bonus;
    $('#title').hidden = true;
    showModal(`<div class="eyebrow">New survivor</div><h2>Who were you before?</h2>
      <label class="mono muted" for="c-name">Name</label><input type="text" id="c-name" maxlength="20" value="${esc(st.name)}">
      <h3>Background</h3><div class="grid">${Object.keys(BACKGROUNDS).map(k => { const b = BACKGROUNDS[k]; return `<button class="card ${k === st.bg ? 'sel' : ''}" data-bg="${k}" style="text-align:left"><h4>${b.n}</h4><span class="muted" style="font-size:13px">${b.desc}</span><span class="mono" style="color:var(--ember)">${Object.keys(b.bonus).map(a => `+${b.bonus[a]} ${a.toUpperCase()}`).join(' ')}</span><span class="mono muted">${Object.keys(b.items).map(i => itemName(i)).join(', ')}</span></button>`; }).join('')}</div>
      <h3>Attributes <span class="mono muted">${st.pts} points left</span></h3>
      ${Object.keys(ATTRS).map(k => `<div class="attr-row"><b>${ATTRS[k].n}</b><span class="muted" style="font-size:13px">${ATTRS[k].d}</span><div class="stepper"><button data-dn="${k}" aria-label="Lower">−</button><span class="v">${st.a[k] + (bgB[k] || 0)}</span><button data-up="${k}" aria-label="Raise">+</button></div></div>`).join('')}
      <div class="row end"><button class="btn ghost" id="c-back">Back</button><button class="btn" id="c-go">Descend into the bunker</button></div>`, true);
    $('#c-name').addEventListener('input', e => st.name = e.target.value);
    bind('[data-bg]', el => { st.bg = el.dataset.bg; render(); });
    bind('[data-up]', el => { const k = el.dataset.up; if (st.pts > 0 && st.a[k] < 9) { st.a[k]++; st.pts--; render(); } });
    bind('[data-dn]', el => { const k = el.dataset.dn; if (st.a[k] > 1) { st.a[k]--; st.pts++; render(); } });
    bind('#c-back', () => { $('#modal-wrap').hidden = true; UI.open = false; showTitle(); });
    bind('#c-go', () => {
      newGame((st.name || 'Survivor').trim().slice(0, 20) || 'Survivor', st.bg, st.a);
      $('#modal-wrap').hidden = true; UI.open = false;
      startPlay(); G.seenScenes.intro = true; Hooks.queue({ type: 'scene', id: 'intro' });
      Hooks.queue({ type: 'fn', fn: showHelp });
    });
  };
  render();
}
function startPlay() {
  UI.running = true; UI.zombies = []; UI.survSprites = {}; UI.q = UI.q || []; UI.lastDoor = Math.floor(G.p.x) + ',' + Math.floor(G.p.y);
  G.atShelter = inShelter(G.p.x, G.p.y); G.isNight = isNight();
  revealAround(G.p.x, G.p.y, visRadius());
  $('#ticker').innerHTML = '';
  refreshHUD();
}
function initEmbers() { const e = $('#embers'); let h = ''; for (let i = 0; i < 28; i++) h += `<i style="left:${Math.random() * 100}%;--dx:${(Math.random() - 0.5) * 120}px;animation-duration:${6 + Math.random() * 8}s;animation-delay:${-Math.random() * 10}s;opacity:${0.4 + Math.random() * 0.6}"></i>`; e.innerHTML = h; }

/* ---------- Boot ---------- */
function boot(data) {
  resize(); initEmbers();
  if (data && data.save) { try { loadFrom(data.save); $('#title').hidden = true; startPlay(); } catch (e) { showTitle(); } }
  else showTitle();
  requestAnimationFrame(loop);
}
if (window.claude && window.claude.hot) { try { window.claude.hot.snapshot(() => (G && UI.running && !G.dead ? { save: serialize() } : {})); } catch (e) {} }
window.claude && window.claude.hot && window.claude.hot.ready ? window.claude.hot.ready(boot) : boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
